name: Build multi-version matrix

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { name: paper-1.21.11, project: paper, target: 1.21.11-paper, jdk: '21' }
          - { name: paper-26.1.2, project: paper, target: 26.1.2-paper, jdk: '25' }
          - { name: paper-26.2, project: paper, target: 26.2-paper, jdk: '25' }
          - { name: fabric-1.21.11, project: fabric, target: 1.21.11-fabric, jdk: '21' }
          - { name: fabric-26.1.2, project: fabric, target: 26.1.2-fabric, jdk: '25' }
          - { name: fabric-26.2, project: fabric, target: 26.2-fabric, jdk: '25' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug workspace
        run: ls -R "$GITHUB_WORKSPACE"

      - name: Nuclear Gradle cleanup 1
        run: |
          rm -rf "$GITHUB_WORKSPACE/.gradle"
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/composite-builds
          rm -rf ~/.gradle/configuration-cache
          rm -rf ~/.gradle/build-scan-data

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set active target
        run: |
          TARGET="${{ matrix.target }}"
          if [ "${{ matrix.project }}" = "paper" ]; then
            FABRIC_TARGET="${TARGET%-paper}-fabric"
            echo "STONECUTTER_ACTIVE=${FABRIC_TARGET}" >> $GITHUB_ENV
            echo "STONECUTTER_ACTIVE_PAPER=${TARGET}" >> $GITHUB_ENV
          else
            echo "STONECUTTER_ACTIVE=${TARGET}" >> $GITHUB_ENV
            echo "STONECUTTER_ACTIVE_PAPER=__none__" >> $GITHUB_ENV
          fi

      - name: Clean Gradle caches
        run: rm -rf ~/.gradle/caches ~/.gradle/composite-builds ~/.gradle/configuration-cache ~/.gradle/build-scan-data

      - name: Clean project Gradle dir
        run: rm -rf "$GITHUB_WORKSPACE/.gradle"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          ./gradlew :${{ matrix.project }}:build --no-daemon --stacktrace
