name: Build, test & release

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # setup-java exports JAVA_HOME_<n>_X64; let Gradle toolchains use both JDKs
  # (1.21.11 targets compile for Java 21, 26.x targets for Java 25).
  GRADLE_TOOLCHAINS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 -Porg.gradle.java.installations.auto-download=false

jobs:
  test:
    name: Unit & in-process HTTP tests (common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Test
        run: ./gradlew :common:test --no-daemon --stacktrace $GRADLE_TOOLCHAINS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: common/build/reports/tests/

  protocol:
    name: Cross-language protocol tests (HungerBridgePy vs. standalone bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: HungerNet/HungerBridgePy
          path: HungerBridgePy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start standalone bridge (real HTTP stack, fake game backend)
        run: |
          ./gradlew :common:standaloneBridge --no-daemon $GRADLE_TOOLCHAINS -Phb.standalone.port=19130 > bridge.log 2>&1 &
          for i in $(seq 1 240); do grep -q '^PICKUP_URL=' bridge.log && break; sleep 1; done
          grep -m1 '^PICKUP_URL=' bridge.log | cut -d= -f2- > pickup.txt
          test -s pickup.txt || (cat bridge.log; exit 1)

      - name: HungerBridgePy unit + live protocol tests
        working-directory: HungerBridgePy
        run: |
          pip install -e ".[test]"
          pytest -q
          HB_PICKUP_URL="$(cat ../pickup.txt)" HB_EXPECT_PLATFORM=standalone pytest -q -m live tests/test_live.py

      - name: Bridge log
        if: always()
        run: cat bridge.log || true

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: paper, minecraft: 1.21.11, target: 1.21.11-paper }
          - { loader: paper, minecraft: 26.1.2, target: 26.1.2-paper }
          - { loader: paper, minecraft: "26.2", target: 26.2-paper }
          - { loader: paper, minecraft: "26.3", target: 26.3-paper }
          - { loader: fabric, minecraft: 1.21.11, target: 1.21.11-fabric }
          - { loader: fabric, minecraft: 26.1.2, target: 26.1.2-fabric }
          - { loader: fabric, minecraft: "26.2", target: 26.2-fabric }
          - { loader: fabric, minecraft: "26.3", target: 26.3-fabric }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Build
        env:
          HB_TARGET: ${{ matrix.target }}
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx6g"
          ./gradlew :${{ matrix.loader }}:versions:${{ matrix.target }}:build --no-daemon --stacktrace $GRADLE_TOOLCHAINS

      - name: Stage jar with its release metadata
        run: |
          mkdir -p staged
          cp ${{ matrix.loader }}/versions/${{ matrix.target }}/build/libs/HungerBridge-*.jar staged/
          rm -f staged/*-sources.jar staged/*-dev.jar
          echo '{"loader": "${{ matrix.loader }}", "minecraft": "${{ matrix.minecraft }}"}' > staged/target.json

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: staged/
          if-no-files-found: error

  boot:
    name: Boot ${{ matrix.server }} ${{ matrix.minecraft }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [paper, purpur, folia, fabric]
        minecraft: [1.21.11, 26.1.2, "26.2", "26.3"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: HungerNet/HungerBridgePy
          path: HungerBridgePy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.minecraft }}-${{ matrix.server == 'fabric' && 'fabric' || 'paper' }}
          path: jar/

      - name: Boot test (real server, console assertions, live suite)
        run: |
          pip install -e "HungerBridgePy[test]"
          JAVA="$JAVA_HOME_25_X64/bin/java"
          if [ "${{ matrix.minecraft }}" = "1.21.11" ]; then JAVA="$JAVA_HOME_21_X64/bin/java"; fi
          python ci/boot_test.py --loader ${{ matrix.server }} --minecraft ${{ matrix.minecraft }} \
            --jar "$(ls jar/HungerBridge-*.jar | head -1)" \
            --java "$JAVA" \
            --hungerbridgepy HungerBridgePy

      - name: Server console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.server }}-${{ matrix.minecraft }}
          path: boot-server/console.log

  publish:
    name: Publish Releases
    runs-on: ubuntu-latest
    needs: [test, protocol, build, boot]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Read version.yaml
        id: version
        run: |
          RUN=$(grep -m1 '^run:' version.yaml | sed -E 's/^run:[[:space:]]*//')
          VERSION=$(grep -m1 '^version:' version.yaml | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')

          test -n "$VERSION"

          RELEASE_TYPE="release"
          PUBLISH_MODRINTH="true"

          if [[ "$VERSION" == *"-dev."* ]]; then
            RELEASE_TYPE="alpha"
            PUBLISH_MODRINTH="false"
          elif [[ "$VERSION" == *"-alpha."* ]]; then
            RELEASE_TYPE="alpha"
          elif [[ "$VERSION" == *"-beta."* ]]; then
            RELEASE_TYPE="beta"
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "publish_modrinth=$PUBLISH_MODRINTH" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.run == 'true'
        with:
          pattern: jar-*
          path: release/

      - name: Publish to Modrinth
        if: steps.version.outputs.run == 'true' && steps.version.outputs.publish_modrinth == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python ci/publish_modrinth.py \
            --version "${{ steps.version.outputs.version }}" \
            --type "${{ steps.version.outputs.release_type }}" \
            --changelog CHANGELOG.md \
            --artifacts release/

      - name: Create GitHub Release
        if: steps.version.outputs.run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: HungerBridge ${{ steps.version.outputs.version }}
          body: |
            HungerBridge multiloader release.

            Paper jars also run on Purpur and Folia.
            Fabric jars require only Fabric Loader.

            Minecraft versions:
            - 1.21.11
            - 26.1.2
            - 26.2
            - 26.3

          files: release/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}