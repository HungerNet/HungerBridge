name: Build & Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { name: paper-1.21.11, project: paper, target: 1.21.11-paper, jdk: '25' }
          - { name: paper-26.1.2, project: paper, target: 26.1.2-paper, jdk: '25' }
          - { name: paper-26.2, project: paper, target: 26.2-paper, jdk: '25' }
          - { name: fabric-1.21.11, project: fabric, target: 1.21.11-fabric, jdk: '25' }
          - { name: fabric-26.1.2, project: fabric, target: 26.1.2-fabric, jdk: '25' }
          - { name: fabric-26.2, project: fabric, target: 26.2-fabric, jdk: '25' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set active Stonecutter target
        run: |
          echo "STONECUTTER_ACTIVE=${{ matrix.target }}" >> $GITHUB_ENV
          if [ "${{ matrix.project }}" = "paper" ]; then
            echo "STONECUTTER_ACTIVE_PAPER=${{ matrix.target }}" >> $GITHUB_ENV
          else
            echo "STONECUTTER_ACTIVE_PAPER=__none__" >> $GITHUB_ENV
          fi

      - name: Build version
        run: |
          export JAVA_TOOL_OPTIONS="-Xmx6g"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx6g"

          if [ "${{ matrix.project }}" = "paper" ]; then
            ./gradlew :paper:versions:${{ matrix.target }}:build --no-daemon --stacktrace
          else
            ./gradlew :fabric:versions:${{ matrix.target }}:build --no-daemon --stacktrace
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            paper/versions/${{ matrix.target }}/build/libs/*.jar
            fabric/versions/${{ matrix.target }}/build/libs/*.jar

  release:
    runs-on: ubuntu-latest
    needs: build-matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' version.yaml | sed 's/version:[[:space:]]*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: HungerBridge ${{ steps.version.outputs.version }}
          body: |
            HungerBridge multiloader release.
            Includes Paper and Fabric builds for all supported versions.
          files: release/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
