buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.yaml:snakeyaml:2.2'
    }
}

import org.yaml.snakeyaml.Yaml

plugins {
    id 'java'
}

def versionYaml = new Yaml().load(file("version.yaml").text)
def hungerBridgeVersion = versionYaml["version"]?.toString()?.trim()
if (!hungerBridgeVersion) {
    throw new GradleException("version.yaml must define a non-empty version")
}

version = hungerBridgeVersion
allprojects {
    ext.hungerBridgeVersion = hungerBridgeVersion
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Per-target projects are named "<minecraft>-<loader>" (e.g. 26.2-paper). Their jars are
    // released as HungerBridge-<loader>-<minecraft>-<version>.jar, which is self-describing in
    // plugins/ or mods/ and is the format HungerBridgePy's release finder (hungerbridge.releases)
    // looks for.
    def target = project.name =~ /^(\d+\.\d+(?:\.\d+)?)-(paper|fabric)$/
    if (target.matches()) {
        base {
            archivesName = "HungerBridge-${target.group(2)}-${target.group(1)}"
        }
    }
}
