plugins {
    id 'java'
}

java {
    toolchain {
        // common is embedded in every platform jar; Java 21 bytecode runs on all targets
        // (Minecraft 1.21.11 requires Java 21, 26.x requires Java 25).
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Autogen runtime templates are bundled at /autogen/* inside the jar and loaded via
// Config.class.getResource("/autogen/...") to seed missing runtime config files.
tasks.processResources {
    from(rootProject.file("autogen/HungerBridge")) {
        into "autogen"
    }
}

dependencies {
    // Provided at runtime by Paper/Folia (all three) and Minecraft/Fabric (gson, log4j);
    // SnakeYAML is shaded into the Fabric jars.
    implementation 'org.yaml:snakeyaml:2.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

// In-process HungerBridge HTTP server with a fake Minecraft backend, used by the
// HungerBridgePy live protocol tests:  ./gradlew :common:standaloneBridge -Phb.standalone.port=19130
tasks.register('standaloneBridge', JavaExec) {
    group = 'verification'
    description = 'Runs the HungerBridge HTTP API with a fake Minecraft backend for client protocol tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hungerbridge.common.testing.StandaloneBridge'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'hb.standalone.port', (findProperty('hb.standalone.port') ?: '19130')
}
