# Example tokens.yaml — human-editable token policy documentation.
# This file is optional and is used to record desired token policy. It is not the
# authoritative source of truth; the runtime server stores active token metadata in
# storage/tokens.json and will not publish secret material there.
#
# allowed_skew_seconds:
#   Maximum tolerated time skew, in seconds, for HMAC-signed requests. This is
#   important when clocks are slightly out of sync between clients and the server.
# default_token_ttl_seconds:
#   Default expiry time for tokens created through policy templates or tooling.
#   0 means "do not expire".
# tokens:
#   Example token definitions that can be used as a policy reference. The server
#   does not automatically create entries from this file; use the admin API or
#   /hb tokens commands for live token creation.
#   Each token entry may contain:
#     - id: stable token id
#     - secret: secret material; never commit this to the repository
#     - revoked: boolean flag to disable a token
#     - expiry: absolute Unix timestamp or 0 for no expiry
#     - whitelist: action names allowed for this token
#     - blacklist: action names explicitly denied for this token
#
# Admin note: Use the /tokens management endpoint with your root X-Auth-Key to
# create and revoke tokens. The created secret is only returned once.

allowed_skew_seconds: 300
default_token_ttl_seconds: 0

