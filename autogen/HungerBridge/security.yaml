# HungerBridge security configuration.
# This file configures reverse-proxy self-protection, IP allow/block lists, rate
# limiting, and retention of audit logs.
#
# ip_list.mode:
#   Mode for IP filtering. Supported values: blacklist and whitelist.
#   An empty list in blacklist mode means allow everything.
# ip_list.list:
#   Source IPs or CIDR ranges to filter.
# rate_limits:
#   Default per-token and per-IP request limits. These values are enforced by the
#   runtime rate limiter and are used to mitigate brute force or abuse.
#   token_rps/token_burst: limit requests per token.
#   ip_rps/ip_burst: limit requests per source IP.
# audit_retention_days:
#   Number of days to keep JSON audit logs before pruning old files.

ip_list:
  mode: blacklist
  list: []

rate_limits:
  token_rps: 5.0
  token_burst: 10.0
  ip_rps: 20.0
  ip_burst: 40.0

audit_retention_days: 14
