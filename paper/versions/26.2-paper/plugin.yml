name: HungerBridge
description: Multiloader HTTP bridge for Paper and Fabric.
author: iFamished
website: https://modrinth.com/project/hungerbridge

main: com.hungerbridge.paper.HungerBridgePlugin
version: ${version}
api-version: 26.2

load: STARTUP
prefix: HungerBridge

commands:
  hungerbridge:
    description: HungerBridge commands
    usage: /hungerbridge <child> <args>
    aliases: [hb]
    permission: hungerbridge.admin
    permission-message: You do not have permission to use this command

permissions:
  hungerbridge.admin:
    default: op

default-permission: op