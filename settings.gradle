pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri("https://maven.fabricmc.net/") }
        maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
    }
}

rootProject.name = "HungerBridge"

include("common")

def defaultFabric = "1.21.11-fabric"
def defaultPaper  = "1.21.11-paper"

// Decide active target from STONECUTTER_ACTIVE to avoid including both loaders
def active = System.getenv("STONECUTTER_ACTIVE") ?: "__none__"

if (active.endsWith("-fabric")) {
    include("fabric")
    include("fabric:versions:${active}")
} else if (active.endsWith("-paper")) {
    include("paper")
    include("paper:versions:${active}")
} else {
    // Fallback: if STONECUTTER_ACTIVE_PAPER is set, prefer that; otherwise default to fabric
    def activePaper = System.getenv("STONECUTTER_ACTIVE_PAPER") ?: "__none__"
    if (activePaper != "__none__") {
        include("paper")
        include("paper:versions:${activePaper}")
    } else {
        include("fabric")
        include("fabric:versions:${defaultFabric}")
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.yaml:snakeyaml:2.2'
    }
}

import org.yaml.snakeyaml.Yaml

def yaml = new Yaml()
def versionData = yaml.load(file("version.yaml").text)

gradle.ext.hbVersion = versionData.version
