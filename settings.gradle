pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri("https://maven.fabricmc.net/") }
        maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
    }
}

rootProject.name = "HungerBridge"

include("common")


// Fabric target ALWAYS comes from STONECUTTER_ACTIVE
def activeFabric = System.getenv("STONECUTTER_ACTIVE") ?: defaultFabric

// Paper target ONLY included when STONECUTTER_ACTIVE_PAPER is NOT "__none__"
def activePaper = System.getenv("STONECUTTER_ACTIVE_PAPER") ?: "__none__"

// STRICT equality — no Groovy truthiness, no trim(), no coercion
if (activePaper != "__none__") {
    include("paper")
    include("paper:versions:${activePaper}")
}

// Fabric ALWAYS included
include("fabric")
include("fabric:versions:${activeFabric}")

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.yaml:snakeyaml:2.2'
    }
}

import org.yaml.snakeyaml.Yaml

def yaml = new Yaml()
def versionData = yaml.load(file("version.yaml").text)

gradle.ext.hbVersion = versionData.version
